# Copy of jekyll-theme-chirpy 7.6.0 _data/origin/cors.yml with the web fonts
# and Font Awesome self-hosted.
#
# Font Awesome: the theme default loads it from jsdelivr's version-range path
# (@7 / @6); the CSS reaches the browser but the webfonts it references
# (../webfonts/*.woff2) do not resolve, so icons render as an empty frame with
# no glyph. Serving both the CSS and the woff2 from our own origin
# (assets/fontawesome/, vendored from fontawesome-free 7.3.1) removes that
# dependency entirely.
#
# Web fonts: the theme default loads Lato + Source Sans Pro from
# fonts.googleapis.com, which leaks every visitor's IP to Google and adds a
# third-party dependency. We serve all families (Lato, Source Sans Pro,
# JetBrains Mono, Zen Kaku Gothic New) from our own origin instead —
# assets/fonts/, vendored as woff2 from @fontsource (see tools/build-fonts.sh).
# The fonts.googleapis.com / fonts.gstatic.com resource hints are dropped
# because nothing loads from them anymore.
#
# Jekyll replaces this whole file, so every key from the theme is kept here.
# Bump with the theme.
# Resource Hints
resource_hints:
  - url: https://cdn.jsdelivr.net
    links:
      - rel: preconnect
      - rel: dns-prefetch

# Web Fonts (self-hosted — see assets/fonts/fonts.css)
webfonts: /assets/fonts/fonts.css

# Libraries

bootstrap:
  css: https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css

toc:
  css: https://cdn.jsdelivr.net/npm/tocbot@4/dist/tocbot.min.css
  js: https://cdn.jsdelivr.net/npm/tocbot@4/dist/tocbot.min.js

fontawesome:
  css: /assets/fontawesome/css/all.min.css

search:
  js: https://cdn.jsdelivr.net/npm/simple-jekyll-search@1/dest/simple-jekyll-search.min.js

mermaid:
  js: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js

dayjs:
  js:
    common: https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js
    locale: https://cdn.jsdelivr.net/npm/dayjs@1/locale/:LOCALE.js
    relativeTime: https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js
    localizedFormat: https://cdn.jsdelivr.net/npm/dayjs@1/plugin/localizedFormat.js

glightbox:
  css: https://cdn.jsdelivr.net/npm/glightbox@3/dist/css/glightbox.min.css
  js: https://cdn.jsdelivr.net/npm/glightbox@3/dist/js/glightbox.min.js

lazy-polyfill:
  css: https://cdn.jsdelivr.net/npm/loading-attribute-polyfill@2/dist/loading-attribute-polyfill.min.css
  js: https://cdn.jsdelivr.net/npm/loading-attribute-polyfill@2/dist/loading-attribute-polyfill.umd.min.js

clipboard:
  js: https://cdn.jsdelivr.net/npm/clipboard@2/dist/clipboard.min.js

mathjax:
  js: https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
