<!--
  Jekyll Simple Search loader (site override)

  Chirpy loads simple-jekyll-search from the jsdelivr CDN via
  `js-selector.html`. When that CDN is unreachable (blocked network,
  offline PWA state, ad-blocker), `SimpleJekyllSearch` is never defined and
  the top-bar search silently does nothing. This override keeps the CDN as
  the primary source but falls back to a locally vendored copy so search
  works regardless of CDN reachability.

  Upstream: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">
        {categories}
        {tags}
      </div>
    </header>
    <p>{content}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {% comment %} Primary library is loaded in `js-selector.html`; local copy is the fallback. {% endcomment %}
  document.addEventListener('DOMContentLoaded', () => {
    const run = () => SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      templateMiddleware: function(prop, value, template) {
        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
          }
        }
      }
    });

    if (typeof SimpleJekyllSearch !== 'undefined') {
      run();
    } else {
      const s = document.createElement('script');
      s.src = '{{ '/assets/js/lib/simple-jekyll-search.min.js' | relative_url }}';
      s.onload = run;
      document.head.appendChild(s);
    }
  });
</script>
