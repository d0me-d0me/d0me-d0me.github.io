<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="Radar chart comparing five evasion approach profiles across six operator cost axes">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#615C50"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="17" font-weight="700" fill="#F2F4EA">Evasion Approach Profiles Across Six Operator Cost Axes</text>
  <text x="450" y="57" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="12" fill="#D9DCCF">ATT&amp;CK v19 &#8212; Stealth (TA0005) versus Defense Impairment (TA0112)</text>
  <text x="450" y="77" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#615C50">Axis scale 1 to 5. Higher means greater cost or exposure to the operator.</text>

  <g stroke="#2A2620" stroke-width="1" fill="none" stroke-dasharray="2 4">
    <polygon points="450.0,293.0 482.0,311.5 482.0,348.5 450.0,367.0 418.0,348.5 418.0,311.5"/>
    <polygon points="450.0,256.0 514.1,293.0 514.1,367.0 450.0,404.0 385.9,367.0 385.9,293.0"/>
    <polygon points="450.0,219.0 546.1,274.5 546.1,385.5 450.0,441.0 353.9,385.5 353.9,274.5"/>
    <polygon points="450.0,182.0 578.2,256.0 578.2,404.0 450.0,478.0 321.8,404.0 321.8,256.0"/>
  </g>
  <polygon points="450.0,145.0 610.2,237.5 610.2,422.5 450.0,515.0 289.8,422.5 289.8,237.5" fill="none" stroke="#2A2620" stroke-width="1.5"/>

  <g stroke="#8F8875" stroke-width="1.5">
    <line x1="450" y1="330" x2="450.0" y2="145.0"/>
    <line x1="450" y1="330" x2="610.2" y2="237.5"/>
    <line x1="450" y1="330" x2="610.2" y2="422.5"/>
    <line x1="450" y1="330" x2="450.0" y2="515.0"/>
    <line x1="450" y1="330" x2="289.8" y2="422.5"/>
    <line x1="450" y1="330" x2="289.8" y2="237.5"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#615C50" text-anchor="start">
    <text x="458" y="296">1</text>
    <text x="458" y="259">2</text>
    <text x="458" y="222">3</text>
    <text x="458" y="185">4</text>
    <text x="458" y="148">5</text>
  </g>

  <g font-family="Zen Kaku Gothic New, sans-serif" font-size="13" font-weight="700" fill="#F2F4EA">
    <text x="450.0" y="119.0" text-anchor="middle">Telemetry Exposure</text>
    <text x="632.7" y="224.5" text-anchor="start">Failure Noise</text>
    <text x="632.7" y="435.5" text-anchor="start">Update Fragility</text>
    <text x="450.0" y="541.0" text-anchor="middle">Privilege Cost</text>
    <text x="267.3" y="435.5" text-anchor="end">Irreversibility</text>
    <text x="267.3" y="224.5" text-anchor="end">Absence Signal</text>
  </g>

  <polygon points="450.0,182.0 610.2,237.5 610.2,422.5 450.0,515.0 289.8,422.5 289.8,237.5" fill="#B48BFF" fill-opacity="0.09" stroke="#B48BFF" stroke-width="2"/>
  <polygon points="450.0,256.0 546.1,274.5 514.1,367.0 450.0,478.0 321.8,404.0 353.9,274.5" fill="#7FA8FF" fill-opacity="0.10" stroke="#7FA8FF" stroke-width="2"/>
  <polygon points="450.0,182.0 578.2,256.0 546.1,385.5 450.0,404.0 418.0,348.5 418.0,311.5" fill="#E5533B" fill-opacity="0.11" stroke="#E5533B" stroke-width="2"/>
  <polygon points="450.0,219.0 514.1,293.0 546.1,385.5 450.0,367.0 418.0,348.5 418.0,311.5" fill="#E5A03B" fill-opacity="0.12" stroke="#E5A03B" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="450.0,145.0 514.1,293.0 514.1,367.0 450.0,367.0 418.0,348.5 418.0,311.5" fill="#48B44A" fill-opacity="0.14" stroke="#48B44A" stroke-width="2"/>

  <g stroke-width="2" fill="#F2F4EA">
    <circle cx="450.0" cy="145.0" r="4" stroke="#48B44A"/>
    <circle cx="450.0" cy="219.0" r="4" stroke="#E5A03B"/>
    <circle cx="578.2" cy="256.0" r="4" stroke="#E5533B"/>
    <circle cx="450.0" cy="404.0" r="4" stroke="#E5533B"/>
    <circle cx="450.0" cy="256.0" r="4" stroke="#7FA8FF"/>
    <circle cx="546.1" cy="274.5" r="4" stroke="#7FA8FF"/>
    <circle cx="450.0" cy="478.0" r="4" stroke="#7FA8FF"/>
    <circle cx="321.8" cy="404.0" r="4" stroke="#7FA8FF"/>
    <circle cx="353.9" cy="274.5" r="4" stroke="#7FA8FF"/>
    <circle cx="610.2" cy="237.5" r="4" stroke="#B48BFF"/>
    <circle cx="610.2" cy="422.5" r="4" stroke="#B48BFF"/>
    <circle cx="450.0" cy="515.0" r="4" stroke="#B48BFF"/>
    <circle cx="289.8" cy="422.5" r="4" stroke="#B48BFF"/>
    <circle cx="289.8" cy="237.5" r="4" stroke="#B48BFF"/>
  </g>

  <g fill="#131210" stroke="#F2F4EA" stroke-width="1.5">
    <circle cx="418.0" cy="311.5" r="5"/>
    <circle cx="418.0" cy="348.5" r="5"/>
    <circle cx="450.0" cy="182.0" r="5"/>
    <circle cx="450.0" cy="367.0" r="5"/>
    <circle cx="514.1" cy="293.0" r="5"/>
    <circle cx="514.1" cy="367.0" r="5"/>
    <circle cx="546.1" cy="385.5" r="5"/>
  </g>

  <rect x="688" y="88" width="192" height="60" rx="3" fill="#131210" stroke="#E5533B" stroke-width="1"/>
  <text x="700" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Exposure axes: what the</text>
  <text x="700" y="126" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">sensor records while it</text>
  <text x="700" y="142" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">is still running.</text>
  <line x1="700" y1="152" x2="648" y2="208" stroke="#615C50" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="30" y="466" width="196" height="60" rx="3" fill="#131210" stroke="#7FA8FF" stroke-width="1"/>
  <text x="42" y="488" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Cost axes: what the</text>
  <text x="42" y="504" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">operator spends and</text>
  <text x="42" y="520" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">cannot put back.</text>
  <line x1="226" y1="480" x2="268" y2="452" stroke="#615C50" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="655" y="462" width="196" height="60" rx="3" fill="#131210" stroke="#B48BFF" stroke-width="1"/>
  <text x="667" y="484" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Total across six axes:</text>
  <text x="667" y="500" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Stealth 11 to 15,</text>
  <text x="667" y="516" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Impairment 18 to 29.</text>
  <line x1="655" y1="480" x2="600" y2="445" stroke="#615C50" stroke-width="1.2" marker-end="url(#ah)"/>

  <line x1="60" y1="574" x2="840" y2="574" stroke="#2A2620" stroke-width="1"/>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">
    <rect x="70" y="593" width="14" height="14" fill="#48B44A" fill-opacity="0.35" stroke="#48B44A" stroke-width="1.5"/>
    <text x="94" y="604">System Binary Proxy Execution &#8212; T1218 &#8212; total 12</text>
    <rect x="70" y="619" width="14" height="14" fill="#E5A03B" fill-opacity="0.35" stroke="#E5A03B" stroke-width="1.5"/>
    <text x="94" y="630">Trusted Developer Utility &#8212; T1127 &#8212; total 11</text>
    <rect x="70" y="645" width="14" height="14" fill="#E5533B" fill-opacity="0.35" stroke="#E5533B" stroke-width="1.5"/>
    <text x="94" y="656">Reflective Loading &#8212; T1620, T1055 &#8212; total 15</text>
    <rect x="470" y="593" width="14" height="14" fill="#7FA8FF" fill-opacity="0.35" stroke="#7FA8FF" stroke-width="1.5"/>
    <text x="494" y="604">Trust Control Subversion &#8212; T1553 &#8212; total 18</text>
    <rect x="470" y="619" width="14" height="14" fill="#B48BFF" fill-opacity="0.35" stroke="#B48BFF" stroke-width="1.5"/>
    <text x="494" y="630">Sensor Disablement &#8212; T1687, T1685 &#8212; total 29</text>
    <circle cx="477" cy="652" r="5" fill="#131210" stroke="#F2F4EA" stroke-width="1.5"/>
    <text x="494" y="656">Shared vertex, two or more profiles</text>
  </g>

  <text x="70" y="684" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">Green, amber, red = Stealth. Blue, purple = Defense Impairment.</text>
</svg>
