<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" role="img" aria-label="Decision flow separating the stealth path from the defense impairment path">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8F8875"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="17" font-weight="700" fill="#F2F4EA">Choosing a Side of the v19 Split</text>
  <text x="450" y="50" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="12" fill="#D9DCCF">The branch decides which detection mode the defender has to use.</text>
  <rect x="350" y="66" width="200" height="34" rx="3" fill="#131210" fill-opacity="1" stroke="#8F8875" stroke-width="1.2"/>
  <text x="450" y="88" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="#F2F4EA">Objective defined</text>
  <line x1="450" y1="100" x2="450" y2="118" stroke="#8F8875" stroke-width="1.4" marker-end="url(#ah)"/>
  <polygon points="250,175 450,120 650,175 450,230" fill="#131210" stroke="#E5A03B" stroke-width="1.5"/>
  <text x="450" y="158" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#F2F4EA">Must a collection point</text>
  <text x="450" y="174" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#F2F4EA">stop producing signal</text>
  <text x="450" y="190" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#F2F4EA">to reach the objective?</text>
  <line x1="350" y1="202.5" x2="227.5" y2="250" stroke="#8F8875" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="550" y1="202.5" x2="672.5" y2="250" stroke="#8F8875" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="288" y="232" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#48B44A">no</text>
  <text x="612" y="232" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#B48BFF">yes</text>
  <rect x="40" y="258" width="375" height="256" rx="4" fill="none" stroke="#48B44A" stroke-width="1"/>
  <rect x="40" y="258" width="375" height="24" rx="4" fill="#48B44A" fill-opacity="0.15" stroke="#48B44A" stroke-width="1"/>
  <text x="227.5" y="275" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="700" fill="#F2F4EA">Stealth (TA0005) &#8212; leave the sensors intact</text>
  <rect x="60" y="294" width="335" height="40" rx="3" fill="#48B44A" fill-opacity="0.08" stroke="#48B44A" stroke-width="1.2"/>
  <text x="227.5" y="318" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#48B44A">System Binary Proxy Execution &#8212; T1218</text>
  <rect x="60" y="344" width="335" height="40" rx="3" fill="#E5A03B" fill-opacity="0.08" stroke="#E5A03B" stroke-width="1.2"/>
  <text x="227.5" y="368" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#E5A03B">Trusted Developer Utility &#8212; T1127</text>
  <rect x="60" y="394" width="335" height="40" rx="3" fill="#E5533B" fill-opacity="0.08" stroke="#E5533B" stroke-width="1.2"/>
  <text x="227.5" y="418" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#E5533B">Reflective Loading &#8212; T1620, T1055</text>
  <rect x="60" y="444" width="335" height="60" rx="3" fill="#131210" fill-opacity="1" stroke="#48B44A" stroke-width="1"/>
  <text x="227.5" y="462" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#D9DCCF">Failure signal: a blocked launch</text>
  <text x="227.5" y="477" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#D9DCCF">or an AMSI verdict. Every</text>
  <text x="227.5" y="492" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#D9DCCF">collection point keeps reporting.</text>
  <rect x="485" y="258" width="375" height="294" rx="4" fill="none" stroke="#B48BFF" stroke-width="1"/>
  <rect x="485" y="258" width="375" height="24" rx="4" fill="#B48BFF" fill-opacity="0.15" stroke="#B48BFF" stroke-width="1"/>
  <text x="672.5" y="275" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="700" fill="#F2F4EA">Defense Impairment (TA0112) &#8212; degrade them</text>
  <rect x="505" y="294" width="335" height="40" rx="3" fill="#7FA8FF" fill-opacity="0.08" stroke="#7FA8FF" stroke-width="1.2"/>
  <text x="672.5" y="318" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#7FA8FF">Trust Control Subversion &#8212; T1553</text>
  <rect x="505" y="344" width="335" height="40" rx="3" fill="#B48BFF" fill-opacity="0.08" stroke="#B48BFF" stroke-width="1.2"/>
  <text x="672.5" y="368" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#B48BFF">Sensor Disablement &#8212; T1687, T1685</text>
  <rect x="505" y="394" width="335" height="40" rx="3" fill="#131210" fill-opacity="1" stroke="#E5533B" stroke-width="1"/>
  <text x="672.5" y="410" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#E5533B">Stage 1 &#8212; at the act</text>
  <text x="672.5" y="425" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#D9DCCF">driver load and integrity events fire</text>
  <rect x="505" y="444" width="335" height="40" rx="3" fill="#131210" fill-opacity="1" stroke="#615C50" stroke-width="1"/>
  <text x="672.5" y="460" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#615C50">Stage 2 &#8212; after success</text>
  <text x="672.5" y="475" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#D9DCCF">the affected rows go quiet</text>
  <rect x="505" y="494" width="335" height="40" rx="3" fill="#131210" fill-opacity="1" stroke="#E5A03B" stroke-width="1"/>
  <text x="672.5" y="510" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#E5A03B">Stage 3 &#8212; at recovery</text>
  <text x="672.5" y="525" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#D9DCCF">the gap is bounded by what stopped</text>
  <line x1="415" y1="350" x2="485" y2="350" stroke="#8F8875" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <line x1="227.5" y1="514" x2="227.5" y2="578" stroke="#8F8875" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="672.5" y1="552" x2="672.5" y2="578" stroke="#8F8875" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="98" y="580" width="259" height="52" rx="3" fill="#131210" fill-opacity="1" stroke="#48B44A" stroke-width="1.4"/>
  <text x="227.5" y="600" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#48B44A">Presence-based detection</text>
  <text x="227.5" y="618" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#D9DCCF">find the event that happened</text>
  <rect x="543" y="580" width="259" height="52" rx="3" fill="#131210" fill-opacity="1" stroke="#B48BFF" stroke-width="1.4"/>
  <text x="672.5" y="600" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#B48BFF">Absence-based detection</text>
  <text x="672.5" y="618" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#D9DCCF">notice the event that stopped</text>
  <line x1="40" y1="656" x2="860" y2="656" stroke="#2A2620" stroke-width="1"/>
  <line x1="40" y1="678" x2="70" y2="678" stroke="#8F8875" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="78" y="682" text-anchor="start" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Main flow</text>
  <line x1="170" y1="678" x2="200" y2="678" stroke="#8F8875" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="208" y="682" text-anchor="start" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Escalation path</text>
  <polygon points="345,678 355,671 365,678 355,685" fill="#131210" stroke="#E5A03B" stroke-width="1.2"/>
  <text x="373" y="682" text-anchor="start" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Decision</text>
  <text x="40" y="706" text-anchor="start" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">Stage timing applies to the impairment path only. Stealth leaves every collection point reporting.</text>
</svg>
