  <line x1="20" y1="447" x2="945" y2="447" stroke="#8F8875" stroke-width="1.5"/>
  <g>
    <rect x="20" y="530" width="300" height="86" fill="#131210" stroke="#E5533B" stroke-width="1" rx="3"/>
    <text x="170" y="549" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#E5533B" text-anchor="middle">The textbook checks fail first</text>
    <text x="170" y="567" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#F2F4EA" text-anchor="middle">$SI/$FN comparison dies at T2.</text>
    <text x="170" y="581" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#F2F4EA" text-anchor="middle">Sub-second truncation dies at T3.</text>
    <text x="170" y="598" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">Both are the two checks most often</text>
    <text x="170" y="610" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">taught as definitive.</text>
  </g>
  <g>
    <rect x="345" y="530" width="330" height="86" fill="#131210" stroke="#48B44A" stroke-width="1" rx="3"/>
    <text x="510" y="549" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#48B44A" text-anchor="middle">The inversion at T4</text>
    <text x="510" y="567" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#F2F4EA" text-anchor="middle">Deleting the journal blinds one detection</text>
    <text x="510" y="581" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#F2F4EA" text-anchor="middle">and creates another: Event 3079,</text>
    <text x="510" y="598" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">plus ghost records left behind in</text>
    <text x="510" y="610" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">$LogFile RCRD pages.</text>
  </g>
  <g>
    <rect x="700" y="530" width="280" height="86" fill="#131210" stroke="#7FA8FF" stroke-width="1" rx="3"/>
    <text x="840" y="549" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#7FA8FF" text-anchor="middle">What actually holds</text>
    <text x="840" y="567" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#F2F4EA" text-anchor="middle">Live API interception, because it</text>
    <text x="840" y="581" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#F2F4EA" text-anchor="middle">records the act, not the residue.</text>
    <text x="840" y="598" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#8F8875" text-anchor="middle">Conditional on prior deployment</text>
    <text x="840" y="610" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#8F8875" text-anchor="middle">and off-host forwarding.</text>
  </g>
  <text x="500" y="646" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#F2F4EA" text-anchor="middle" font-weight="700">No single artifact survives a determined attacker. The bottom row is why detection still works.</text>
  <text x="500" y="666" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#615C50" text-anchor="middle">Sources: MITRE ATT&amp;CK T1070.006 v2.0 &#183; Palmbach &amp; Breitinger DFRWS EU 2020 &#183; inversecos 2022 &#183; Microsoft Learn</text>
