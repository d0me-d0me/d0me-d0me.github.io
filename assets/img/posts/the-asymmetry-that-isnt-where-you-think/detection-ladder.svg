<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="ladder-title" preserveAspectRatio="xMidYMid meet">
  <title id="ladder-title">Which timestomping detections survive at each attacker capability tier</title>
  <defs><marker id="lad-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8F8875"/></marker></defs>
  <text x="500" y="42" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#F2F4EA" text-anchor="middle">Detection Survival by Attacker Capability Tier</text>
  <text x="500" y="62" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#8F8875" text-anchor="middle">Each tier adds one technique. Green = detection holds. Red = detection is blind.</text>
  <line x1="325" y1="96" x2="937" y2="96" stroke="#8F8875" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#lad-arrow)"/>
  <text x="635.0" y="88" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8F8875" text-anchor="middle">increasing attacker sophistication</text>
  <text x="387" y="124" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#F2F4EA" text-anchor="middle">T1</text>
  <text x="387" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">$SI only</text>
  <text x="387" y="153" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" fill="#615C50" text-anchor="middle">API call</text>
  <text x="511" y="124" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#F2F4EA" text-anchor="middle">T2</text>
  <text x="511" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">+ move/rename</text>
  <text x="511" y="153" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" fill="#615C50" text-anchor="middle">$FN inherited</text>
  <text x="635" y="124" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#F2F4EA" text-anchor="middle">T3</text>
  <text x="635" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">+ sub-second</text>
  <text x="635" y="153" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" fill="#615C50" text-anchor="middle">100ns control</text>
  <text x="759" y="124" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#F2F4EA" text-anchor="middle">T4</text>
  <text x="759" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">+ journal del</text>
  <text x="759" y="153" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" fill="#615C50" text-anchor="middle">fsutil</text>
  <text x="883" y="124" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#F2F4EA" text-anchor="middle">T5</text>
  <text x="883" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#D9DCCF" text-anchor="middle">+ log flood</text>
  <text x="883" y="153" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" fill="#615C50" text-anchor="middle">cyclic overwrite</text>
  <text x="308" y="196" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#F2F4EA" text-anchor="end">$SI vs $FN mismatch</text>
  <text x="308" y="210" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#8F8875" text-anchor="end">classic MFT check</text>
  <text x="308" y="252" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#F2F4EA" text-anchor="end">Sub-second truncation</text>
  <text x="308" y="266" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#8F8875" text-anchor="end">the .0000000 tell</text>
  <text x="308" y="306" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#F2F4EA" text-anchor="end">$UsnJrnl BASIC_INFO</text>
  <text x="308" y="320" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#8F8875" text-anchor="end">journal change record</text>
  <text x="308" y="362" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#F2F4EA" text-anchor="end">$LogFile transaction</text>
  <text x="308" y="376" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#8F8875" text-anchor="end">NTFS redo/undo log</text>
  <text x="308" y="416" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#F2F4EA" text-anchor="end">Sysmon EID 2 / EDR</text>
  <text x="308" y="430" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#8F8875" text-anchor="end">live API interception</text>
  <text x="308" y="472" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#F2F4EA" text-anchor="end">Removal-trace artifacts</text>
  <text x="308" y="486" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#8F8875" text-anchor="end">cleanup leaves its own</text>
