<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <marker id="dm-arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="none" stroke="#8F8875" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" fill="#F2F4EA" font-family="Zen Kaku Gothic New, sans-serif" font-size="14" font-weight="bold">Detection Indicator Matrix</text>

  <!-- Column headers -->
  <text x="215" y="58" text-anchor="middle" fill="#48B44A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="bold">Stage 0</text>
  <text x="215" y="71" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">Worker Pinning</text>

  <text x="390" y="58" text-anchor="middle" fill="#E5A03B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="bold">Stage 1</text>
  <text x="390" y="71" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">Disclosure</text>

  <text x="565" y="58" text-anchor="middle" fill="#E5533B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="bold">Stage 2</text>
  <text x="565" y="71" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">RCE</text>

  <!-- Row headers -->
  <text x="20" y="112" fill="#F2F4EA" font-family="Zen Kaku Gothic New, sans-serif" font-size="11" font-weight="bold">Network</text>
  <text x="20" y="172" fill="#F2F4EA" font-family="Zen Kaku Gothic New, sans-serif" font-size="11" font-weight="bold">HTTP / WAF</text>
  <text x="20" y="232" fill="#F2F4EA" font-family="Zen Kaku Gothic New, sans-serif" font-size="11" font-weight="bold">Access Log</text>
  <text x="20" y="292" fill="#F2F4EA" font-family="Zen Kaku Gothic New, sans-serif" font-size="11" font-weight="bold">Host / EDR</text>

  <!-- Grid lines -->
  <line x1="120" y1="42" x2="120" y2="340" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="295" y1="42" x2="295" y2="340" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="470" y1="42" x2="470" y2="340" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="20" y1="82" x2="680" y2="82" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="20" y1="142" x2="680" y2="142" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="20" y1="202" x2="680" y2="202" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="20" y1="262" x2="680" y2="262" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="20" y1="340" x2="680" y2="340" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Row 1: Network -->
  <!-- Stage 0 - strong -->
  <rect x="135" y="92" width="160" height="40" rx="3" fill="#48B44A" fill-opacity="0.15" stroke="#48B44A" stroke-width="1"/>
  <text x="215" y="108" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">~150 concurrent conns</text>
  <text x="215" y="122" text-anchor="middle" fill="#48B44A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" font-weight="bold">HIGH CONFIDENCE</text>

  <!-- Stage 1 - moderate -->
  <rect x="310" y="92" width="160" height="40" rx="3" fill="#E5A03B" fill-opacity="0.1" stroke="#2A2620" stroke-width="1"/>
  <text x="390" y="108" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">Large POST bodies</text>
  <text x="390" y="122" text-anchor="middle" fill="#E5A03B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">MODERATE</text>

  <!-- Stage 2 - moderate -->
  <rect x="485" y="92" width="160" height="40" rx="3" fill="#E5A03B" fill-opacity="0.1" stroke="#2A2620" stroke-width="1"/>
  <text x="565" y="108" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">Sustained slow POSTs</text>
  <text x="565" y="122" text-anchor="middle" fill="#E5A03B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">MODERATE</text>

  <!-- Row 2: HTTP / WAF -->
  <!-- Stage 0 - low -->
  <rect x="135" y="152" width="160" height="40" rx="3" fill="#131210" stroke="#2A2620" stroke-width="1"/>
  <text x="215" y="168" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">Keep-alive requests</text>
  <text x="215" y="182" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">LOW</text>

  <!-- Stage 1 - strong -->
  <rect x="310" y="152" width="160" height="40" rx="3" fill="#48B44A" fill-opacity="0.15" stroke="#48B44A" stroke-width="1"/>
  <text x="390" y="168" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">PHPSESSID &gt; 257 chars</text>
  <text x="390" y="182" text-anchor="middle" fill="#48B44A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" font-weight="bold">HIGH CONFIDENCE</text>

  <!-- Stage 2 - moderate -->
  <rect x="485" y="152" width="160" height="40" rx="3" fill="#E5A03B" fill-opacity="0.1" stroke="#2A2620" stroke-width="1"/>
  <text x="565" y="168" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">multipart to non-upload</text>
  <text x="565" y="182" text-anchor="middle" fill="#E5A03B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">MODERATE</text>

  <!-- Row 3: Access Log -->
  <!-- Stage 0 - low -->
  <rect x="135" y="212" width="160" height="40" rx="3" fill="#131210" stroke="#2A2620" stroke-width="1"/>
  <text x="215" y="228" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">Volume only</text>
  <text x="215" y="242" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">LOW</text>

  <!-- Stage 1 - moderate -->
  <rect x="310" y="212" width="160" height="40" rx="3" fill="#E5A03B" fill-opacity="0.1" stroke="#2A2620" stroke-width="1"/>
  <text x="390" y="228" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">Interleaved 500 / 200</text>
  <text x="390" y="242" text-anchor="middle" fill="#E5A03B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">MODERATE</text>

  <!-- Stage 2 - moderate -->
  <rect x="485" y="212" width="160" height="40" rx="3" fill="#E5A03B" fill-opacity="0.1" stroke="#2A2620" stroke-width="1"/>
  <text x="565" y="228" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">500 bursts + large POST</text>
  <text x="565" y="242" text-anchor="middle" fill="#E5A03B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">MODERATE</text>

  <!-- Row 4: Host / EDR -->
  <!-- Stage 0 - none -->
  <rect x="135" y="272" width="160" height="55" rx="3" fill="#131210" stroke="#2A2620" stroke-width="1"/>
  <text x="215" y="296" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">No host indicators</text>
  <text x="215" y="316" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">NONE</text>

  <!-- Stage 1 - low -->
  <rect x="310" y="272" width="160" height="55" rx="3" fill="#131210" stroke="#2A2620" stroke-width="1"/>
  <text x="390" y="290" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">memory_limit warnings</text>
  <text x="390" y="302" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">(if logged)</text>
  <text x="390" y="316" text-anchor="middle" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">LOW</text>

  <!-- Stage 2 - strong -->
  <rect x="485" y="272" width="160" height="55" rx="3" fill="#48B44A" fill-opacity="0.15" stroke="#48B44A" stroke-width="1"/>
  <text x="565" y="290" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">SIGSEGV + child spawn</text>
  <text x="565" y="302" text-anchor="middle" fill="#D9DCCF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">from httpd / php-fpm</text>
  <text x="565" y="316" text-anchor="middle" fill="#48B44A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" font-weight="bold">HIGH CONFIDENCE</text>

  <!-- Legend -->
  <rect x="20" y="354" width="660" height="56" rx="3" fill="#131210" stroke="#2A2620" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="40" y="374" fill="#F2F4EA" font-family="Zen Kaku Gothic New, sans-serif" font-size="11" font-weight="bold">Confidence</text>

  <rect x="120" y="365" width="14" height="14" rx="2" fill="#48B44A" fill-opacity="0.15" stroke="#48B44A" stroke-width="1"/>
  <text x="142" y="376" fill="#48B44A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">HIGH — low false-positive, strong single indicator</text>

  <rect x="120" y="385" width="14" height="14" rx="2" fill="#E5A03B" fill-opacity="0.1" stroke="#2A2620" stroke-width="1"/>
  <text x="142" y="396" fill="#E5A03B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">MODERATE — requires correlation or baseline</text>

  <rect x="440" y="365" width="14" height="14" rx="2" fill="#131210" stroke="#2A2620" stroke-width="1"/>
  <text x="462" y="376" fill="#615C50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">LOW / NONE — weak or absent</text>
</svg>