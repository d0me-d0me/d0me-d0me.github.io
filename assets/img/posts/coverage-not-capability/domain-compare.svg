<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Comparison of the detection strategy model across the three ATT&amp;CK v19 matrices">
  <text x="450" y="34" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="17" font-weight="700" fill="#F2F4EA">The Detection Model Across Three Matrices</text>
  <text x="450" y="56" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="12" fill="#D9DCCF">Detection Strategies and Analytics exist in all three v19 matrices. Density and the evasion split do not.</text>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875" text-anchor="middle">
    <text x="300" y="96">Detection Strategies</text>
    <text x="430" y="96">Analytics</text>
    <text x="545" y="96">AN / DET</text>
    <text x="700" y="96">Evasion tactic in v19</text>
  </g>
  <line x1="40" y1="106" x2="860" y2="106" stroke="#2A2620" stroke-width="1"/>

  <!-- Enterprise row -->
  <rect x="40" y="120" width="820" height="104" rx="4" fill="#48B44A" fill-opacity="0.06" stroke="#48B44A" stroke-width="1.4"/>
  <text x="60" y="150" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#F2F4EA">Enterprise</text>
  <text x="60" y="170" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">15 tactics</text>
  <text x="60" y="186" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">697 techniques</text>
  <text x="300" y="176" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#48B44A">697</text>
  <text x="430" y="176" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#48B44A">1758</text>
  <text x="545" y="176" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#F2F4EA">2.5</text>
  <rect x="612" y="150" width="110" height="24" rx="3" fill="#48B44A" fill-opacity="0.18" stroke="#48B44A" stroke-width="1"/>
  <text x="667" y="166" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#F2F4EA">Stealth</text>
  <rect x="730" y="150" width="118" height="24" rx="3" fill="#B48BFF" fill-opacity="0.18" stroke="#B48BFF" stroke-width="1"/>
  <text x="789" y="166" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#F2F4EA">Def. Impairment</text>
  <text x="612" y="196" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">Split into two tactics in v19.</text>

  <!-- Mobile row -->
  <rect x="40" y="234" width="820" height="80" rx="4" fill="#7FA8FF" fill-opacity="0.05" stroke="#3F5CB0" stroke-width="1.2"/>
  <text x="60" y="264" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#F2F4EA">Mobile</text>
  <text x="60" y="284" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">12 tactics</text>
  <text x="60" y="300" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">124 techniques</text>
  <text x="300" y="284" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" font-weight="700" fill="#7FA8FF">124</text>
  <text x="430" y="284" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" font-weight="700" fill="#7FA8FF">211</text>
  <text x="545" y="284" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" font-weight="700" fill="#F2F4EA">1.7</text>
  <rect x="612" y="262" width="150" height="24" rx="3" fill="#8F8875" fill-opacity="0.12" stroke="#8F8875" stroke-width="1"/>
  <text x="687" y="278" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Defense Evasion</text>
  <text x="772" y="278" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">single</text>

  <!-- ICS row -->
  <rect x="40" y="324" width="820" height="80" rx="4" fill="#E5A03B" fill-opacity="0.05" stroke="#9A6E17" stroke-width="1.2"/>
  <text x="60" y="354" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#F2F4EA">ICS</text>
  <text x="60" y="374" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">12 tactics</text>
  <text x="60" y="390" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">97 techniques</text>
  <text x="300" y="374" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" font-weight="700" fill="#E5A03B">97</text>
  <text x="430" y="374" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" font-weight="700" fill="#E5A03B">97</text>
  <text x="545" y="374" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" font-weight="700" fill="#F2F4EA">1.0</text>
  <rect x="612" y="352" width="90" height="24" rx="3" fill="#8F8875" fill-opacity="0.12" stroke="#8F8875" stroke-width="1"/>
  <text x="657" y="368" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">Evasion</text>
  <text x="710" y="368" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F8875">one AN per strategy</text>

  <line x1="40" y1="430" x2="860" y2="430" stroke="#2A2620" stroke-width="1"/>
  <text x="40" y="454" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">The two-tier model reached every matrix in v19, but only Enterprise separates hiding from breaking.</text>
  <text x="40" y="474" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#D9DCCF">ICS sits at one analytic per strategy: the container is present, the behavioural depth is not yet.</text>
  <text x="40" y="500" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8F8875">Technique counts include sub-techniques and differ from the tactic-page totals cited in prose.</text>
</svg>
